name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # 👈 Triggers the build every time you push to the 'main' branch

permissions:
  contents: write # 👈 Gives GitHub Actions permission to create the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 👈 Standard stable long-term support version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # 👈 Clean installation of your precise package-lock dependencies

      - name: Build Production Files
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # 👈 Vite compiles everything into the 'dist' folder
          branch: gh-pages # 👈 The branch where your live site files will live